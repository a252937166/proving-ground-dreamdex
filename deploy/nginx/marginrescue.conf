server {
    listen 80;
    listen [::]:80;
    server_name marginrescue.axiqo.xyz;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/marginrescue/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://marginrescue.axiqo.xyz$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name marginrescue.axiqo.xyz;
    ssl_certificate /etc/letsencrypt/live/marginrescue.axiqo.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marginrescue.axiqo.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/marginrescue/current;
    index index.html;
    server_tokens off;
    autoindex off;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location ~ (^|/)\. { return 404; }
    location / { try_files $uri $uri.html $uri/ =404; }
}
